# Version catalog: every version used by the backend lives here (like <properties> + <dependencyManagement>).
# Build files refer to these as libs.<name>, e.g. libs.grpc.stub for "grpc-stub".

[versions]
kotlin = "2.3.21"
spring-boot = "4.1.2"
spring-dependency-management = "1.1.7"
protobuf-plugin = "0.10.0"
# Code generators: keep in line with the protobuf-java / grpc-java versions managed by the Spring Boot BOM.
protobuf = "4.36.2"
grpc = "1.84.1"
grpc-kotlin = "1.5.0"
protovalidate = "1.3.0"
mockk = "1.14.11"

[libraries]
# Libraries without a version get it from the Spring Boot BOM.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-grpc-server = { module = "org.springframework.boot:spring-boot-starter-grpc-server" }
spring-boot-starter-grpc-server-test = { module = "org.springframework.boot:spring-boot-starter-grpc-server-test" }
spring-boot-starter-grpc-client = { module = "org.springframework.boot:spring-boot-starter-grpc-client" }
spring-boot-starter-data-jdbc = { module = "org.springframework.boot:spring-boot-starter-data-jdbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
# Flyway core has no Postgres support built in; it ships per database.
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-stub = { module = "io.grpc:grpc-stub" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin" }
# Checks a message against the (buf.validate.field) rules in its .proto. The jar also holds buf/validate/validate.proto,
# which the protobuf plugin unpacks so the contracts can import it.
protovalidate = { module = "build.buf:protovalidate", version.ref = "protovalidate" }

kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
spring-boot-starter-data-jdbc-test = { module = "org.springframework.boot:spring-boot-starter-data-jdbc-test" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
# Mocks for Kotlin (Kotlin's answer to Mockito). Not in the Spring Boot BOM, so it needs a version.
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# protoc and its plugins: executables downloaded by the protobuf Gradle plugin, not runtime dependencies.
protoc-compiler = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
protoc-gen-grpc-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
protoc-gen-grpc-kotlin = { module = "io.grpc:protoc-gen-grpc-kotlin", version.ref = "grpc-kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
