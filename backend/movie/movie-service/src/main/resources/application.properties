spring.application.name=movie-service
spring.grpc.server.port=9091

# The default for running on the host; compose overrides it. Connects on the first call, so media-service can start later.
spring.grpc.client.channel.media.target=localhost:9092

# Defaults for running on the host; compose overrides them with SPRING_DATASOURCE_* env vars.
spring.datasource.url=jdbc:postgresql://localhost:5432/app
spring.datasource.username=movie
spring.datasource.password=movie

# Flyway runs db/migration/*.sql on start-up and keeps its history in movie.flyway_schema_history.
spring.flyway.schemas=movie
