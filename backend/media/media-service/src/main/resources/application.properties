spring.application.name=media-service
spring.grpc.server.port=9092

# The default for running on the host; compose overrides it. Connects on the first call, so movie-service can start later.
spring.grpc.client.channel.movie.target=localhost:9091

# The folder holding every file. In compose, this is where the media-data volume is mounted.
media.storage.root=/data/media
