syntax = "proto3";

// Owned by the Media team. Breaking changes go into a new package (media.v2), served alongside v1.
package media.v1;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "com.backend.media.api.v1";

service MediaService {
  // The first message is the header; every later one is a chunk of the file.
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);
  // The first message is the file's info; every later one is a chunk of it.
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileResponse);
  // Deleting something that's already gone succeeds.
  rpc DeleteFile(DeleteFileRequest) returns (google.protobuf.Empty);
  rpc DeleteMovieFiles(DeleteMovieFilesRequest) returns (google.protobuf.Empty);
}

// 0 means "not set", which the service rejects.
enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  ARTWORK = 1;
  PREVIEW = 2;
  FULL = 3;
}

message UploadHeader {
  string movie_id = 1;
  MediaKind kind = 2;
  optional int32 duration_seconds = 3;
}

message UploadFileRequest {
  oneof payload {
    UploadHeader header = 1;
    bytes chunk = 2;
  }
}

message UploadFileResponse {
  string storage_key = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  optional int32 duration_seconds = 4;
}

message ReadFileRequest {
  string storage_key = 1;
  int64 offset = 2;
  // Not set means "to the end of the file".
  optional int64 length = 3;
}

message FileInfo {
  string content_type = 1;
  int64 total_size = 2;
}

message ReadFileResponse {
  oneof payload {
    FileInfo info = 1;
    bytes chunk = 2;
  }
}

message DeleteFileRequest {
  string storage_key = 1;
}

message DeleteMovieFilesRequest {
  string movie_id = 1;
}
