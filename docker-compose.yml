name: movie-app

services:
  # Postgres 18 (matches the version we'd run on AWS RDS). Everything else runs on the host.
  # Local-only credentials; a real deployment would inject them as secrets.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: app
      # The superuser; only the init script uses it. movie-app connects as the movie role it creates.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 on the host, so it doesn't clash with another Postgres already on 5432.
      - "5433:5432"
    volumes:
      # The 18 image keeps its data in a versioned subfolder (/var/lib/postgresql/18/docker), so mount the parent.
      - postgres-data:/var/lib/postgresql
      # Runs once on an empty volume: creates the movie role, schema and pg_trgm.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  # Optional sample data, only started with: docker compose --profile seed up
  seed:
    image: postgres:18
    profiles: [seed]
    # seed.sh retries until movie-app has created the tables, so Postgres can still be starting.
    depends_on: [postgres]
    environment:
      PGHOST: postgres
      PGDATABASE: app
      PGUSER: movie
      PGPASSWORD: movie
    volumes:
      - ./infra/postgres/seed:/seed:ro
    command: ["sh", "/seed/seed.sh"]

volumes:
  postgres-data:
