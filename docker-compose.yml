name: movie-app

services:
  # Postgres 18 (matches the version we'd run on AWS RDS). No host port: only the services connect to it.
  # Local-only credentials; a real deployment would inject them as secrets.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: app
      # The superuser; only the init script uses it. movie-service connects as the movie role it creates.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # The 18 image keeps its data in a versioned subfolder (/var/lib/postgresql/18/docker), so mount the parent.
      - postgres-data:/var/lib/postgresql
      # Runs once on an empty volume: creates the movie role, schema and pg_trgm.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h localhost: during the init scripts Postgres only listens on its socket, so this stays
      # unhealthy until init has finished and the real server is up.
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "app"]
      interval: 5s
      timeout: 3s
      retries: 12

  movie-service:
    build:
      context: ./backend
      dockerfile: movie/Dockerfile
    # gRPC on 9091, reachable only inside the compose network (no host port).
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
      SPRING_GRPC_CLIENT_CHANNEL_MEDIA_TARGET: media-service:9092
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:9091"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  media-service:
    build:
      context: ./backend
      dockerfile: media/Dockerfile
    environment:
      SPRING_GRPC_CLIENT_CHANNEL_MOVIE_TARGET: movie-service:9091
    volumes:
      # Artwork and video files, laid out as {movieId}/{artwork|preview|full}/{uuid}.{ext}.
      - media-data:/data/media
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:9092"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      MOVIE_SERVICE_ADDR: movie-service:9091
      MEDIA_SERVICE_ADDR: media-service:9092
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      movie-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
    environment:
      # Called from the user's browser, so it must be the host-facing gateway URL.
      GRAPHQL_URL: http://localhost:4000/graphql
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres-data:
  media-data:
